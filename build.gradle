plugins {
    id 'fabric-loom' version '1.13.6'
}

version = project.mod_version
group = 'lock'

// Loom is used purely to compile against the Mojang-named 1.21.11 API.
// The shipped artifact is built by :injector, which remaps these classes to the runtime names.
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Rendering/hook layers are mid-port to the 1.21.11 pipeline; keep them out of the build until then.
sourceSets.main.java {
    exclude 'lock/render/Draw.java', 'lock/render/WorldEsp.java', 'lock/render/HealthHud.java',
            'lock/render/CharmLayers.java', 'lock/render/Projection.java', 'lock/agent/**'
}
